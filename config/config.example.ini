; Copy this file to config/config.ini and fill in your real values.
; config/config.ini is gitignored and must NEVER be committed.

[deepseek]
api_key = sk-your-deepseek-api-key-here
base_url = https://api.deepseek.com
model = deepseek-chat


[qwen]
; Qwen / Alibaba DashScope (Bailian). The model must support web search (enable_search),
; e.g. qwen-plus / qwen-turbo / qwen-flash. Get a key at bailian.console.aliyun.com
api_key = sk-your-qwen-dashscope-api-key-here
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model = qwen-plus

[dashboard]
; Password gate for the Streamlit dashboard. Choose your own.
password = change-me
